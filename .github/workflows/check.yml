name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:native
      - run: npm run build:native
      - run: npm run verify:native-source
      - run: npm run build
      - run: npm run bundle
      - uses: actions/upload-artifact@v4
        with:
          name: display-switch
          path: |
            display-switch.zip
            display-switch.zip.sha256
